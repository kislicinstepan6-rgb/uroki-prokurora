<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Уроки прокурора • Осторожно, зима!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040b18;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }
    .viewer {
      position: relative;
      width: 100%;
      max-width: 960px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
    .slide-img {
      width: 100%;
      max-height: 70dvh;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 28px rgba(14, 165, 233, 0.25);
      background: #071326;
      user-select: none;
    }
    .controls {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 6px;
    }
    .voice-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid #38bdf8;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
      transition: 0.2s;
    }
    .voice-btn.speaking {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-color: #f87171;
      box-shadow: 0 0 18px rgba(248, 113, 113, 0.4);
    }
    .nav-row {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: #0b192c;
      color: #e0f2fe;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
  </style>
</head>
<body>

  <div class="header">
    <span>ПРОКУРАТУРА Г. НАЗАРОВО</span>
    <span id="counter">Слайд 1 / 7</span>
  </div>

  <div class="viewer" id="swipeArea">
    <img id="slideImg" class="slide-img" src="https://i.postimg.cc/3ycXNc53/0CE3E982-764B-48A0-9FA8-37D1321361E2.png" alt="Слайд презентации" />
  </div>

  <div class="controls">
    <div id="subtitleText" class="subtitle"></div>
    <button id="voiceBtn" class="voice-btn" onclick="toggleSpeech()">🔊 Озвучить слайд</button>
    <div class="nav-row">
      <button id="prevBtn" class="nav-btn" onclick="changeSlide(-1)">← Назад</button>
      <button id="nextBtn" class="nav-btn" onclick="changeSlide(1)">Вперёд →</button>
    </div>
  </div>

  <script>
    const slidesData = [
      {
        img: "https://i.postimg.cc/3ycXNc53/0CE3E982-764B-48A0-9FA8-37D1321361E2.png",
        text: "Прокуратура города Назарово представляет: Уроки прокурора. Серия: Осторожно, зима! Горка, тормозной путь, лёд, наушники, мошенничество и личная безопасность. Безопасность — твоя ответственность."
      },
      {
        img: "https://i.postimg.cc/zLcCvcZJ/3B5E4555-8D58-42D2-AB54-4225AAF3A753.png",
        text: "Как мошенники работают зимой. Остерегайся звонков якобы от Деда Мороза с просьбой назвать данные карты, предложений подарков за предоплату доставки, незнакомцев в костюмах, которые просятся в подъезд или квартиру, а также фейковых сборов на общие подарки."
      },
      {
        img: "https://i.postimg.cc/R3D7hD56/6048B0E5-869B-4A78-85AC-DC51C67009FA.png",
        text: "Запомни эти правила. Никогда не переводи деньги и не называй данные карты незнакомцам. Настоящий подарок не требует предоплаты. Не открывай дверь незнакомым людям в костюмах — позови взрослых. Если что-то вызывает подозрение, расскажи родителям или звони 112. Проверяй акции только на официальных сайтах."
      },
      {
        img: "https://i.postimg.cc/sBXPVR8V/701C8B66-5522-4A9D-9209-CE82FC0F89DD.png",
        text: "Твои данные и границы — тоже защита. Не называй незнакомцам адрес, номер школы и когда родителей нет дома. Не выкладывай в открытый доступ фото с точным местом в реальном времени. Не переходи по подозрительным ссылкам. Если кто-то давит или просит никому не говорить — сразу расскажи взрослым."
      },
      {
        img: "https://i.postimg.cc/p9TQ2tSw/C3D30C2C-8543-4BD8-B20F-B9316E2EA970.png",
        text: "Холод и переохлаждение. Если замёрз — сразу иди домой. Признаки переохлаждения: онемение, бледная кожа, сильная дрожь, сонливость и замедленная речь. Одевайся по погоде, не снимай шапку и носи нескользящую обувь."
      },
      {
        img: "https://i.postimg.cc/8F0Rc0Qp/C85C3E5A-A52C-41DF-BCC6-311FC054D4F4.png",
        text: "Главные правила зимы. Первое: горки только в безопасных местах. Второе: помни про длинный тормозной путь. Третье: на лёд без взрослых нельзя. Четвёртое: у дороги без наушников. Пятое: не переводи деньги мошенникам. Шестое: береги личные данные. Седьмое: пиротехника только со взрослыми. Восьмое: в любой опасной ситуации звони 112."
      },
      {
        img: "https://i.postimg.cc/MMfyQmqv/EB1D824A-0E37-445A-8BE9-0B5E01504861.png",
        text: "Соблюдай правила — и зима будет в радость. А если с тобой или твоим другом случилась беда — я всегда помогу. Нужна помощь? Набери 112. Прокуратура города Назарово."
      }
    ];

    let current = 0;
    const imgEl = document.getElementById("slideImg");
    const counterEl = document.getElementById("counter");
    const subtitleEl = document.getElementById("subtitleText");
    const voiceBtn = document.getElementById("voiceBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function renderSlide() {
      stopSpeech();
      const item = slidesData[current];
      imgEl.src = item.img;
      counterEl.textContent = `Слайд ${current + 1} / ${slidesData.length}`;
      subtitleEl.textContent = item.text;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slidesData.length - 1;
    }

    function changeSlide(dir) {
      const next = current + dir;
      if (next >= 0 && next < slidesData.length) {
        current = next;
        renderSlide();
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      voiceBtn.classList.remove("speaking");
      voiceBtn.textContent = "🔊 Озвучить слайд";
    }

    function toggleSpeech() {
      if (!("speechSynthesis" in window)) {
        alert("Ваш браузер не поддерживает голосовую озвучку.");
        return;
      }
      if (window.speechSynthesis.speaking) {
        stopSpeech();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(slidesData[current].text);
      utterance.lang = "ru-RU";
      utterance.rate = 0.98;
      utterance.onend = () => stopSpeech();
      utterance.onerror = () => stopSpeech();

      voiceBtn.classList.add("speaking");
      voiceBtn.textContent = "⏹ Остановить озвучку";
      window.speechSynthesis.speak(utterance);
    }

    let touchStartX = 0;
    const swipeArea = document.getElementById("swipeArea");
    swipeArea.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    swipeArea.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 45) {
        changeSlide(diff > 0 ? 1 : -1);
      }
    }, { passive: true });

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") changeSlide(1);
      if (e.key === "ArrowLeft") changeSlide(-1);
    });

    renderSlide();
  </script>
</body>
</html>
